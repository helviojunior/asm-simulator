# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtQueryKey
ssn: null
summary: "Le a informacao de uma chave de registro: nome completo, quantidade de subchaves e de valores."
input_args:
  arg0:
    type: "HANDLE"
    name: "KeyHandle"
    direction: "in"
    description: "Handle da chave. Exige KEY_QUERY_VALUE, menos para KeyNameInformation, que aceita qualquer acesso nao nulo."
  arg1:
    type: "KEY_INFORMATION_CLASS"
    name: "KeyInformationClass"
    direction: "in"
    description: "O que ler (KeyBasicInformation 0, KeyFullInformation 2, KeyNameInformation 3)."
  arg2:
    type: "PVOID"
    name: "KeyInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg3:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg4:
    type: "PULONG"
    name: "ResultLength"
    direction: "out"
    description: "Recebe o tamanho necessario. Com KeyInformation NULL e Length 0, e so isso que a chamada faz: medir."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
