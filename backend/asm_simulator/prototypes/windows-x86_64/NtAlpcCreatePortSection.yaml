function_name: NtAlpcCreatePortSection
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Combinacao de flags."
  arg2:
    type: "HANDLE"
    name: "SectionHandle"
    direction: "in/opt"
    description: "Handle da secao (objeto de memoria compartilhavel). Opcional."
  arg3:
    type: "SIZE_T"
    name: "SectionSize"
    direction: "in"
    description: "Tamanho em bytes."
  arg4:
    type: "PALPC_HANDLE"
    name: "AlpcSectionHandle"
    direction: "out"
    description: "Handle do objeto."
  arg5:
    type: "PSIZE_T"
    name: "ActualSectionSize"
    direction: "out"
    description: "Tamanho em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
