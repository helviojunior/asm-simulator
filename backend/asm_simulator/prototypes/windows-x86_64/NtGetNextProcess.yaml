# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtGetNextProcess
ssn: null
summary: "Devolve o proximo processo do sistema. Enumera processos sem snapshot e sem saber os PIDs."
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in/opt"
    description: "Processo de onde continuar. NULL comeca a enumeracao; nas voltas seguintes passa-se o handle devolvido na anterior."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Acesso pedido para cada handle. Processo que nao puder ser aberto assim e PULADO, e nao devolvido."
  arg2:
    type: "ULONG"
    name: "HandleAttributes"
    direction: "in"
    description: "Flags de OBJECT_ATTRIBUTES para o novo handle (OBJ_INHERIT...). Normalmente 0."
  arg3:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "0 percorre na ordem normal; 1 percorre em ordem inversa."
  arg4:
    type: "PHANDLE"
    name: "NewProcessHandle"
    direction: "out"
    description: "Recebe o handle do proximo processo. E do chamador o dever de fecha-lo com NtClose."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "Erro (nao ha mais processo acessivel com aquele acesso) e como o laco de enumeracao termina."
