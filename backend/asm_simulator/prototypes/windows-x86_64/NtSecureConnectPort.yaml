function_name: NtSecureConnectPort
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "PortHandle"
    direction: "out"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "PCUNICODE_STRING"
    name: "PortName"
    direction: "in"
    description: "Nome, em UNICODE_STRING."
  arg2:
    type: "PSECURITY_QUALITY_OF_SERVICE"
    name: "SecurityQos"
    direction: "in"
    description: "Entrada: PSECURITY_QUALITY_OF_SERVICE."
  arg3:
    type: "PPORT_VIEW"
    name: "ClientView"
    direction: "inout/opt"
    description: "Entra e sai: PPORT_VIEW. Opcional."
  arg4:
    type: "PSID"
    name: "RequiredServerSid"
    direction: "in/opt"
    description: "Entrada: PSID. Opcional."
  arg5:
    type: "PREMOTE_PORT_VIEW"
    name: "ServerView"
    direction: "inout/opt"
    description: "Entra e sai: PREMOTE_PORT_VIEW. Opcional."
  arg6:
    type: "PULONG"
    name: "MaxMessageLength"
    direction: "out/opt"
    description: "Tamanho em bytes. Opcional."
  arg7:
    type: "PVOID"
    name: "ConnectionInformation"
    direction: "inout/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg8:
    type: "PULONG"
    name: "ConnectionInformationLength"
    direction: "inout/opt"
    description: "Tamanho do bloco de informacao, em bytes. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
