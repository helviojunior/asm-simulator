# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtQuerySystemInformationEx
ssn: null
summary: "Como NtQuerySystemInformation, mas com buffer de ENTRADA: e para as classes que precisam de um parametro (um handle, um numero de processador)."
input_args:
  arg0:
    type: "SYSTEM_INFORMATION_CLASS"
    name: "SystemInformationClass"
    direction: "in"
    description: "O que ler. So valem as classes que aceitam parametro (SystemLogicalProcessorInformationEx 107, por exemplo)."
  arg1:
    type: "PVOID"
    name: "InputBuffer"
    direction: "in"
    description: "Parametro da classe: o handle, o numero do grupo de processadores (USHORT) ou o processador sobre o qual se pergunta."
  arg2:
    type: "ULONG"
    name: "InputBufferLength"
    direction: "in"
    description: "Tamanho do buffer de entrada. Nem ele pode ser 0 nem InputBuffer pode ser NULL: a chamada falha em vez de virar um NtQuerySystemInformation."
  arg3:
    type: "PVOID"
    name: "SystemInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg4:
    type: "ULONG"
    name: "SystemInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg5:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
