# Prototipo de funcao de modo usuario da ntdll. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntrtl.h
function_name: RtlDestroyProcessParameters
kind: function
ssn: null
summary: "Libera o bloco montado por RtlCreateProcessParameters."
input_args:
  arg0:
    type: "PRTL_USER_PROCESS_PARAMETERS"
    name: "ProcessParameters"
    direction: "in"
    description: "Bloco a liberar. Pode ser feito assim que o processo foi criado."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
