# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtQueryObject
ssn: null
summary: "Le a informacao generica de um handle: nome, tipo e contagem de referencias."
input_args:
  arg0:
    type: "HANDLE"
    name: "Handle"
    direction: "in/opt"
    description: "Handle do objeto. So pode ser NULL com ObjectTypesInformation, que fala dos TIPOS e nao de um objeto."
  arg1:
    type: "OBJECT_INFORMATION_CLASS"
    name: "ObjectInformationClass"
    direction: "in"
    description: "O que ler (ObjectBasicInformation 0, ObjectNameInformation 1, ObjectTypesInformation 3)."
  arg2:
    type: "PVOID"
    name: "ObjectInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg3:
    type: "ULONG"
    name: "ObjectInformationLength"
    direction: "in"
    description: "Tamanho do bloco, em bytes. Com ObjectTypesInformation nao ha como medir antes: e preciso chutar um buffer grande."
  arg4:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
