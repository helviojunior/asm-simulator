function_name: NtQueryObject
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "Handle"
    direction: "in/opt"
    description: "Handle do objeto. Opcional."
  arg1:
    type: "OBJECT_INFORMATION_CLASS"
    name: "ObjectInformationClass"
    direction: "in"
    description: "Entrada: OBJECT_INFORMATION_CLASS."
  arg2:
    type: "PVOID"
    name: "ObjectInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg3:
    type: "ULONG"
    name: "ObjectInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
