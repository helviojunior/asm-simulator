# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtSetEvent
ssn: null
summary: "Sinaliza um evento, liberando quem espera por ele."
input_args:
  arg0:
    type: "HANDLE"
    name: "EventHandle"
    direction: "in"
    description: "Evento a sinalizar. Exige EVENT_MODIFY_STATE."
  arg1:
    type: "PLONG"
    name: "PreviousState"
    direction: "out/opt"
    description: "Recebe o estado anterior: 1 ja estava sinalizado, 0 nao estava. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
