# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntseapi.h
function_name: NtImpersonateAnonymousToken
ssn: null
summary: "Faz a thread passar a usar o token anonimo — descarta a identidade atual sem precisar de privilegio."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Thread que passa a impersonar. Exige THREAD_IMPERSONATE, que NtCurrentThread (-2) sempre tem."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
