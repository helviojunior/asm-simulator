function_name: NtOpenProcessTokenEx
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "ULONG"
    name: "HandleAttributes"
    direction: "in"
    description: "Atributos do objeto."
  arg3:
    type: "PHANDLE"
    name: "TokenHandle"
    direction: "out"
    description: "Handle do token de acesso."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
