# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtSaveKey
ssn: null
summary: "Grava uma chave e toda a subarvore dela num arquivo de hive, em formato binario. Exige SE_BACKUP_NAME."
input_args:
  arg0:
    type: "HANDLE"
    name: "KeyHandle"
    direction: "in"
    description: "Chave a gravar. Vai ela E toda a subarvore abaixo dela."
  arg1:
    type: "HANDLE"
    name: "FileHandle"
    direction: "in"
    description: "Arquivo de destino, aberto com FILE_WRITE_DATA. NtSaveKey usa o formato REG_STANDARD_FORMAT (1)."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
