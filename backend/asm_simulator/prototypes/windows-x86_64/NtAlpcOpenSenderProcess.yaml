function_name: NtAlpcOpenSenderProcess
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "ProcessHandle"
    direction: "out"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg2:
    type: "PPORT_MESSAGE"
    name: "PortMessage"
    direction: "in"
    description: "Entrada: PPORT_MESSAGE."
  arg3:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Combinacao de flags."
  arg4:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg5:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
