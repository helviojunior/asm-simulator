    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PULONG_PTR"
    name: "NumberOfPages"
    direction: "inout"
    description: "Entra e sai: PULONG_PTR."
  arg2:
    type: "PULONG_PTR"
    name: "UserPfnArray"
    direction: "in"
    description: "Entrada: PULONG_PTR."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
