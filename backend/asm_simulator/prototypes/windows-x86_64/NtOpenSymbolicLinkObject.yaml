# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtOpenSymbolicLinkObject
ssn: null
summary: "Abre um link simbolico do namespace de objetos (o \\??\\C: que aponta para \\Device\\HarddiskVolume3)."
input_args:
  arg0:
    type: "PHANDLE"
    name: "LinkHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Nome do link simbolico. Obrigatorio: sem nome a chamada falha."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
