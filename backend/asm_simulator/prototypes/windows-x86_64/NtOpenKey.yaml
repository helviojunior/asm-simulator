# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtOpenKey
ssn: null
summary: "Abre uma chave de registro pelo caminho NT (\\Registry\\Machine\\...)."
input_args:
  arg0:
    type: "PHANDLE"
    name: "KeyHandle"
    direction: "out"
    description: "Handle da chave de registro."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "KEY_READ e/ou KEY_WRITE, tipicamente."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Caminho da chave (\\Registry\\Machine\\...). Com RootDirectory preenchido, o nome e relativo aquela chave. O nome nunca e sensivel a maiusculas, mesmo sem OBJ_CASE_INSENSITIVE."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
