function_name: NtCreateUserProcess
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "ProcessHandle"
    direction: "out"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PHANDLE"
    name: "ThreadHandle"
    direction: "out"
    description: "Handle da thread alvo. NtCurrentThread (-2) e a propria."
  arg2:
    type: "ACCESS_MASK"
    name: "ProcessDesiredAccess"
    direction: "in"
    description: "Entrada: ACCESS_MASK."
  arg3:
    type: "ACCESS_MASK"
    name: "ThreadDesiredAccess"
    direction: "in"
    description: "Entrada: ACCESS_MASK."
  arg4:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ProcessObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto. Opcional."
  arg5:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ThreadObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto. Opcional."
  arg6:
    type: "ULONG"
    name: "ProcessFlags"
    direction: "in"
    description: "Combinacao de flags."
  arg7:
    type: "ULONG"
    name: "ThreadFlags"
    direction: "in"
    description: "Combinacao de flags."
  arg8:
    type: "PRTL_USER_PROCESS_PARAMETERS"
    name: "ProcessParameters"
    direction: "in/opt"
    description: "Entrada: PRTL_USER_PROCESS_PARAMETERS. Opcional."
  arg9:
    type: "PPS_CREATE_INFO"
    name: "CreateInfo"
    direction: "inout"
    description: "Entra e sai: PPS_CREATE_INFO."
  arg10:
    type: "PPS_ATTRIBUTE_LIST"
    name: "AttributeList"
    direction: "in/opt"
    description: "Entrada: PPS_ATTRIBUTE_LIST. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
