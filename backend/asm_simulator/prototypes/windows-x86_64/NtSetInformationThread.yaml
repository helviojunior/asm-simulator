# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtSetInformationThread
ssn: null
summary: "Altera uma propriedade de uma thread: prioridade, afinidade, ou o famoso ThreadHideFromDebugger."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread. Exige THREAD_SET_LIMITED_INFORMATION ou THREAD_SET_INFORMATION. NtCurrentThread (-2) e a propria."
  arg1:
    type: "THREADINFOCLASS"
    name: "ThreadInformationClass"
    direction: "in"
    description: "O que alterar (ThreadPriority 2, ThreadAffinityMask 4, ThreadImpersonationToken 5, ThreadHideFromDebugger 17)."
  arg2:
    type: "PVOID"
    name: "ThreadInformation"
    direction: "in"
    description: "Bloco com o novo valor. Para ThreadImpersonationToken e um HANDLE de token — NULL desfaz a impersonation."
  arg3:
    type: "ULONG"
    name: "ThreadInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
