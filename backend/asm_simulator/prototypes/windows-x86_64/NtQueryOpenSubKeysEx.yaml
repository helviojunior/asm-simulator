# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtQueryOpenSubKeysEx
ssn: null
summary: "Como NtQueryOpenSubKeys, mas diz QUEM tem cada chave aberta (PID e nome), e nao so quantas sao. Exige SE_BACKUP_NAME."
input_args:
  arg0:
    type: "POBJECT_ATTRIBUTES"
    name: "TargetKey"
    direction: "in"
    description: "Qualquer chave do hive, em OBJECT_ATTRIBUTES — nao precisa ser a raiz dele."
  arg1:
    type: "ULONG"
    name: "BufferLength"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg2:
    type: "PVOID"
    name: "Buffer"
    direction: "out/opt"
    description: "Recebe um KEY_OPEN_SUBKEYS_INFORMATION: contagem seguida de pares (PID, nome da chave). Opcional."
  arg3:
    type: "PULONG"
    name: "RequiredSize"
    direction: "out"
    description: "Recebe o tamanho necessario para o buffer."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
