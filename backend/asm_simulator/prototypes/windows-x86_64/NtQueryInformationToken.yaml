function_name: NtQueryInformationToken
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "TokenHandle"
    direction: "in"
    description: "Handle do token de acesso."
  arg1:
    type: "TOKEN_INFORMATION_CLASS"
    name: "TokenInformationClass"
    direction: "in"
    description: "Entrada: TOKEN_INFORMATION_CLASS."
  arg2:
    type: "PVOID"
    name: "TokenInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg3:
    type: "ULONG"
    name: "TokenInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
