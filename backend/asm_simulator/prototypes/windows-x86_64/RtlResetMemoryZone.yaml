# Prototipo de funcao de modo usuario da ntdll. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntrtl.h
function_name: RtlResetMemoryZone
kind: function
library: "ntdll.dll"
ssn: null
summary: "Devolve a zona ao estado vazio, sem liberar a memoria: o proximo bloco sai do inicio de novo."
input_args:
  arg0:
    type: "PVOID"
    name: "MemoryZone"
    direction: "in"
    description: "Zona a reiniciar. TODOS os blocos entregues por ela passam a ser lixo."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
