# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntioapi.h
function_name: NtQueryDirectoryFile
ssn: null
summary: "Lista o conteudo de um diretorio ja aberto. E o motor de FindFirstFile/FindNextFile."
input_args:
  arg0:
    type: "HANDLE"
    name: "FileHandle"
    direction: "in"
    description: "Handle de um DIRETORIO, aberto com FILE_DIRECTORY_FILE em NtOpenFile/NtCreateFile. Um handle de arquivo comum falha."
  arg1:
    type: "HANDLE"
    name: "Event"
    direction: "in/opt"
    description: "Evento sinalizado ao fim de uma operacao assincrona. NULL e o comum."
  arg2:
    type: "PIO_APC_ROUTINE"
    name: "ApcRoutine"
    direction: "in/opt"
    description: "Rotina de conclusao assincrona. NULL e o comum."
  arg3:
    type: "PVOID"
    name: "ApcContext"
    direction: "in/opt"
    description: "Valor entregue a ApcRoutine. Opcional."
  arg4:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg5:
    type: "PVOID"
    name: "FileInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg6:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg7:
    type: "FILE_INFORMATION_CLASS"
    name: "FileInformationClass"
    direction: "in"
    description: "Formato das entradas (FileDirectoryInformation 1, FileBothDirectoryInformation 3, FileIdBothDirectoryInformation 37)."
  arg8:
    type: "BOOLEAN"
    name: "ReturnSingleEntry"
    direction: "in"
    description: "TRUE devolve uma entrada por chamada; FALSE enche o buffer."
  arg9:
    type: "PCUNICODE_STRING"
    name: "FileName"
    direction: "in/opt"
    description: "Filtro dos nomes, com curingas (\"Hello.*\"). NULL nao filtra nada."
  arg10:
    type: "BOOLEAN"
    name: "RestartScan"
    direction: "in"
    description: "TRUE recomeca do inicio do diretorio; FALSE continua de onde parou. IGNORADO na primeira chamada com aquele handle."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
