# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntseapi.h
function_name: NtOpenThreadToken
ssn: null
summary: "Abre o token de impersonation de uma thread. Sem impersonation ativa o status e STATUS_NO_TOKEN."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Thread cujo token de impersonation se quer. Exige THREAD_QUERY_LIMITED_INFORMATION ou THREAD_QUERY_INFORMATION."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "BOOLEAN"
    name: "OpenAsSelf"
    direction: "in"
    description: "TRUE abre com a identidade do PROCESSO, e nao com a que a thread esta impersonando — e o que evita o servico perder acesso ao proprio token."
  arg3:
    type: "PHANDLE"
    name: "TokenHandle"
    direction: "out"
    description: "Handle do token de acesso."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
