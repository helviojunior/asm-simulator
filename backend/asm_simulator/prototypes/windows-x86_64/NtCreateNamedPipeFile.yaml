function_name: NtCreateNamedPipeFile
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "FileHandle"
    direction: "out"
    description: "Handle do arquivo."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags."
  arg3:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg4:
    type: "ULONG"
    name: "ShareAccess"
    direction: "in"
    description: "FILE_SHARE_READ 1, FILE_SHARE_WRITE 2, FILE_SHARE_DELETE 4."
  arg5:
    type: "ULONG"
    name: "CreateDisposition"
    direction: "in"
    description: "FILE_OPEN 1, FILE_CREATE 2, FILE_OVERWRITE_IF 5."
  arg6:
    type: "ULONG"
    name: "CreateOptions"
    direction: "in"
    description: "FILE_SYNCHRONOUS_IO_NONALERT 0x20 faz a E/S ser sincrona."
  arg7:
    type: "ULONG"
    name: "NamedPipeType"
    direction: "in"
    description: "Entrada: ULONG."
  arg8:
    type: "ULONG"
    name: "ReadMode"
    direction: "in"
    description: "Entrada: ULONG."
  arg9:
    type: "ULONG"
    name: "CompletionMode"
    direction: "in"
    description: "Entrada: ULONG."
  arg10:
    type: "ULONG"
    name: "MaximumInstances"
    direction: "in"
    description: "Entrada: ULONG."
  arg11:
    type: "ULONG"
    name: "InboundQuota"
    direction: "in"
    description: "Entrada: ULONG."
  arg12:
    type: "ULONG"
    name: "OutboundQuota"
    direction: "in"
    description: "Entrada: ULONG."
  arg13:
    type: "PLARGE_INTEGER"
    name: "DefaultTimeout"
    direction: "in"
    description: "Entrada: PLARGE_INTEGER."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
