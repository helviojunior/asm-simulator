# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntlpcapi.h
function_name: NtAlpcCreateSectionView
ssn: null
summary: "Mapeia no processo uma view da secao da porta. E por ela que os dados grandes trafegam."
input_args:
  arg0:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Reservado. Passe 0."
  arg2:
    type: "PALPC_DATA_VIEW_ATTR"
    name: "ViewAttributes"
    direction: "inout"
    description: "ALPC_DATA_VIEW_ATTR preenchido com a secao e o tamanho; ViewBase precisa entrar NULL e volta com o endereco mapeado."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
