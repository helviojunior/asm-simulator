# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntioapi.h
function_name: NtCreateFile
ssn: null
summary: "Abre ou cria um arquivo. Equivalente de baixo nivel de CreateFileW."
input_args:
  arg0:
    type: "PHANDLE"
    name: "FileHandle"
    direction: "out"
    description: "Handle do arquivo."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "GENERIC_READ 0x80000000, GENERIC_WRITE 0x40000000."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Nome em UNICODE_STRING, no formato NT: \\??\\C:\\caminho."
  arg3:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg4:
    type: "PLARGE_INTEGER"
    name: "AllocationSize"
    direction: "in/opt"
    description: "Tamanho inicial do arquivo. NULL deixa o sistema decidir."
  arg5:
    type: "ULONG"
    name: "FileAttributes"
    direction: "in"
    description: "FILE_ATTRIBUTE_NORMAL 0x80."
  arg6:
    type: "ULONG"
    name: "ShareAccess"
    direction: "in"
    description: "FILE_SHARE_READ 1, FILE_SHARE_WRITE 2."
  arg7:
    type: "ULONG"
    name: "CreateDisposition"
    direction: "in"
    description: "FILE_OPEN 1, FILE_CREATE 2, FILE_OVERWRITE_IF 5."
  arg8:
    type: "ULONG"
    name: "CreateOptions"
    direction: "in"
    description: "FILE_SYNCHRONOUS_IO_NONALERT 0x20 faz a E/S ser sincrona."
  arg9:
    type: "PVOID"
    name: "EaBuffer"
    direction: "in/opt"
    description: "Entrada: PVOID. Opcional."
  arg10:
    type: "ULONG"
    name: "EaLength"
    direction: "in"
    description: "Tamanho em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
