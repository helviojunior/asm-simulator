function_name: NtCreateTransaction
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "TransactionHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "LPGUID"
    name: "Uow"
    direction: "in/opt"
    description: "Entrada: LPGUID. Opcional."
  arg4:
    type: "HANDLE"
    name: "TmHandle"
    direction: "in/opt"
    description: "Handle do objeto. Opcional."
  arg5:
    type: "ULONG"
    name: "CreateOptions"
    direction: "in/opt"
    description: "FILE_SYNCHRONOUS_IO_NONALERT 0x20 faz a E/S ser sincrona. Opcional."
  arg6:
    type: "ULONG"
    name: "IsolationLevel"
    direction: "in/opt"
    description: "Entrada: ULONG. Opcional."
  arg7:
    type: "ULONG"
    name: "IsolationFlags"
    direction: "in/opt"
    description: "Combinacao de flags. Opcional."
  arg8:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
  arg9:
    type: "PCUNICODE_STRING"
    name: "Description"
    direction: "in/opt"
    description: "Entrada: PCUNICODE_STRING. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
