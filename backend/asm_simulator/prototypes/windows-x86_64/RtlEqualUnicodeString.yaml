# Prototipo de funcao de modo usuario da ntdll. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntrtl.h
function_name: RtlEqualUnicodeString
kind: function
library: "ntdll.dll"
ssn: null
summary: "Compara duas UNICODE_STRING. Compara por Length, entao funciona com texto sem terminador nulo — que e o caso do que vem do kernel."
input_args:
  arg0:
    type: "PCUNICODE_STRING"
    name: "String1"
    direction: "in"
    description: "Primeira string."
  arg1:
    type: "PCUNICODE_STRING"
    name: "String2"
    direction: "in"
    description: "Segunda string."
  arg2:
    type: "BOOLEAN"
    name: "CaseInSensitive"
    direction: "in"
    description: "TRUE ignora maiusculas/minusculas — o normal para nome de objeto e de arquivo."
output_data:
  type: "BOOLEAN"
  name: "equal"
  description: "TRUE (1) quando sao iguais; FALSE (0) caso contrario."
