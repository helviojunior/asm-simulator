function_name: NtReplyWaitReceivePort
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "PVOID *"
    name: "PortContext"
    direction: "out/opt"
    description: "Contexto opaco repassado sem interpretacao. Opcional."
  arg2:
    type: "PPORT_MESSAGE"
    name: "ReplyMessage"
    direction: "in/opt"
    description: "Entrada: PPORT_MESSAGE. Opcional."
  arg3:
    type: "PPORT_MESSAGE"
    name: "ReceiveMessage"
    direction: "out"
    description: "Saida: PPORT_MESSAGE."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
