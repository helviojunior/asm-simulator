# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtOpenProcess
ssn: null
summary: "Abre um handle para outro processo."
input_args:
  arg0:
    type: "PHANDLE"
    name: "ProcessHandle"
    direction: "out"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "PROCESS_ALL_ACCESS 0x1FFFFF; ou o minimo necessario, que levanta menos suspeita."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Atributos do objeto (nome, diretorio raiz, flags). NULL onde for opcional."
  arg3:
    type: "PCLIENT_ID"
    name: "ClientId"
    direction: "in/opt"
    description: "Estrutura CLIENT_ID com o PID do alvo em UniqueProcess. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
