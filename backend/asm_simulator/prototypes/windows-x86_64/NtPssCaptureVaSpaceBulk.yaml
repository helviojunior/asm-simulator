function_name: NtPssCaptureVaSpaceBulk
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PVOID"
    name: "BaseAddress"
    direction: "in/opt"
    description: "Endereco base da regiao de memoria. Opcional."
  arg2:
    type: "PNTPSS_MEMORY_BULK_INFORMATION"
    name: "BulkInformation"
    direction: "in"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "SIZE_T"
    name: "BulkInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PSIZE_T"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
