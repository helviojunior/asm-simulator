# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtCreateEvent
ssn: null
summary: "Cria um evento: objeto de sincronizacao com dois estados, sinalizado e nao sinalizado."
input_args:
  arg0:
    type: "PHANDLE"
    name: "EventHandle"
    direction: "out"
    description: "Handle do evento."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "EVENT_TYPE"
    name: "EventType"
    direction: "in"
    description: "NotificationEvent 0 fica sinalizado ate ser limpo (libera todos); SynchronizationEvent 1 volta sozinho a nao sinalizado e libera um."
  arg4:
    type: "BOOLEAN"
    name: "InitialState"
    direction: "in"
    description: "TRUE nasce sinalizado; FALSE nasce nao sinalizado."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
