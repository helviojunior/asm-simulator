# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtQuerySecurityObject
ssn: null
summary: "Le o security descriptor de um objeto pelo handle."
input_args:
  arg0:
    type: "HANDLE"
    name: "Handle"
    direction: "in"
    description: "Handle do objeto. Ler o descritor exige READ_CONTROL (mais ACCESS_SYSTEM_SECURITY para a SACL)."
  arg1:
    type: "SECURITY_INFORMATION"
    name: "SecurityInformation"
    direction: "in"
    description: "Que partes do descritor ler: OWNER_SECURITY_INFORMATION 1, GROUP 2, DACL 4, SACL 8, LABEL 0x10."
  arg2:
    type: "PSECURITY_DESCRIPTOR"
    name: "SecurityDescriptor"
    direction: "out/opt"
    description: "Descritor de seguranca do objeto. Opcional."
  arg3:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg4:
    type: "PULONG"
    name: "LengthNeeded"
    direction: "out"
    description: "Recebe o tamanho necessario. Com STATUS_BUFFER_TOO_SMALL, e o tamanho a alocar."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
