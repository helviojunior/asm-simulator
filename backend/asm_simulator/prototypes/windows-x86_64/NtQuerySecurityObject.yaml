function_name: NtQuerySecurityObject
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "Handle"
    direction: "in"
    description: "Handle do objeto."
  arg1:
    type: "SECURITY_INFORMATION"
    name: "SecurityInformation"
    direction: "in"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg2:
    type: "PSECURITY_DESCRIPTOR"
    name: "SecurityDescriptor"
    direction: "out/opt"
    description: "Descritor de seguranca do objeto. Opcional."
  arg3:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg4:
    type: "PULONG"
    name: "LengthNeeded"
    direction: "out"
    description: "Saida: PULONG."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
