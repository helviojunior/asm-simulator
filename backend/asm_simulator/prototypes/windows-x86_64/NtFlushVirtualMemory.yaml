function_name: NtFlushVirtualMemory
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PVOID *"
    name: "BaseAddress"
    direction: "inout"
    description: "Endereco base da regiao de memoria."
  arg2:
    type: "PSIZE_T"
    name: "RegionSize"
    direction: "inout"
    description: "Tamanho da regiao, em bytes."
  arg3:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatus"
    direction: "out"
    description: "Saida: PIO_STATUS_BLOCK."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
