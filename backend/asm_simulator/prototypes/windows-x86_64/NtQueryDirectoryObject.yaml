# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtQueryDirectoryObject
ssn: null
summary: "Lista as entradas de um diretorio do namespace de objetos — nome e tipo de cada uma."
input_args:
  arg0:
    type: "HANDLE"
    name: "DirectoryHandle"
    direction: "in"
    description: "Handle do objeto."
  arg1:
    type: "PVOID"
    name: "Buffer"
    direction: "out/opt"
    description: "Recebe um vetor de OBJECT_DIRECTORY_INFORMATION: nome e tipo de cada objeto. Opcional."
  arg2:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg3:
    type: "BOOLEAN"
    name: "ReturnSingleEntry"
    direction: "in"
    description: "TRUE devolve uma entrada por chamada; FALSE enche o buffer."
  arg4:
    type: "BOOLEAN"
    name: "RestartScan"
    direction: "in"
    description: "TRUE recomeca do inicio (use na primeira chamada); FALSE continua do ponto guardado em Context."
  arg5:
    type: "PULONG"
    name: "Context"
    direction: "inout"
    description: "Indice da entrada pedida; volta com o indice da ultima efetivamente lida. 0 na primeira chamada, e o mesmo valor nas seguintes."
  arg6:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe os bytes usados — ou os necessarios, se nem uma entrada coube. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "STATUS_SUCCESS quando terminou a listagem; STATUS_MORE_ENTRIES quando o buffer encheu e ha mais a ler."
