function_name: NtQueryDirectoryFileEx
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "FileHandle"
    direction: "in"
    description: "Handle do arquivo."
  arg1:
    type: "HANDLE"
    name: "Event"
    direction: "in/opt"
    description: "Evento sinalizado ao fim de uma operacao assincrona. NULL e o comum."
  arg2:
    type: "PIO_APC_ROUTINE"
    name: "ApcRoutine"
    direction: "in/opt"
    description: "Rotina de conclusao assincrona. NULL e o comum."
  arg3:
    type: "PVOID"
    name: "ApcContext"
    direction: "in/opt"
    description: "Valor entregue a ApcRoutine. Opcional."
  arg4:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg5:
    type: "PVOID"
    name: "FileInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg6:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg7:
    type: "FILE_INFORMATION_CLASS"
    name: "FileInformationClass"
    direction: "in"
    description: "Entrada: FILE_INFORMATION_CLASS."
  arg8:
    type: "ULONG"
    name: "QueryFlags"
    direction: "in"
    description: "Combinacao de flags."
  arg9:
    type: "PCUNICODE_STRING"
    name: "FileName"
    direction: "in/opt"
    description: "Nome, em UNICODE_STRING. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
