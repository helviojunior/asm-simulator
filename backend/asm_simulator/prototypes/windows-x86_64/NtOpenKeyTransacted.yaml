function_name: NtOpenKeyTransacted
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "KeyHandle"
    direction: "out"
    description: "Handle da chave de registro."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags."
  arg3:
    type: "HANDLE"
    name: "TransactionHandle"
    direction: "in"
    description: "Handle do objeto."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
