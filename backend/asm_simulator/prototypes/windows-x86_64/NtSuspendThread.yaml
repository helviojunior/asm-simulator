# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtSuspendThread
ssn: null
summary: "Suspende uma thread."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread alvo."
  arg1:
    type: "PULONG"
    name: "PreviousSuspendCount"
    direction: "out/opt"
    description: "Quantidade de itens. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
