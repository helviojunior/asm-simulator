function_name: NtAlpcSendWaitReceivePort
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Combinacao de flags."
  arg2:
    type: "PPORT_MESSAGE"
    name: "SendMessage"
    direction: "in/opt"
    description: "Entrada: PPORT_MESSAGE. Opcional."
  arg3:
    type: "PALPC_MESSAGE_ATTRIBUTES"
    name: "SendMessageAttributes"
    direction: "inout/opt"
    description: "Atributos do objeto. Opcional."
  arg4:
    type: "PPORT_MESSAGE"
    name: "ReceiveMessage"
    direction: "out/opt"
    description: "Saida: PPORT_MESSAGE. Opcional."
  arg5:
    type: "PSIZE_T"
    name: "BufferLength"
    direction: "inout/opt"
    description: "Tamanho do buffer, em bytes. Opcional."
  arg6:
    type: "PALPC_MESSAGE_ATTRIBUTES"
    name: "ReceiveMessageAttributes"
    direction: "inout/opt"
    description: "Atributos do objeto. Opcional."
  arg7:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
