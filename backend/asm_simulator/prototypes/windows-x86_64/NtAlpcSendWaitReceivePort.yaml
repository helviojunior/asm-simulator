# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntlpcapi.h
function_name: NtAlpcSendWaitReceivePort
ssn: null
summary: "Envia e/ou recebe mensagem numa porta ALPC. Junta as duas operacoes (e a espera entre elas) numa transicao so para o kernel."
input_args:
  arg0:
    type: "HANDLE"
    name: "PortHandle"
    direction: "in"
    description: "Handle da porta de comunicacao (LPC/ALPC)."
  arg1:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "ALPC_MSGFLG_SYNC_REQUEST 0x20000 (sincrono, volta quando a mensagem foi tratada); ALPC_MSGFLG_RELEASE_MESSAGE 0x10000 (nao espera resposta)."
  arg2:
    type: "PPORT_MESSAGE"
    name: "SendMessage"
    direction: "in/opt"
    description: "Mensagem a enviar. NULL so recebe."
  arg3:
    type: "PALPC_MESSAGE_ATTRIBUTES"
    name: "SendMessageAttributes"
    direction: "inout/opt"
    description: "Atributos do objeto. Opcional."
  arg4:
    type: "PPORT_MESSAGE"
    name: "ReceiveMessage"
    direction: "out/opt"
    description: "Recebe a mensagem que chegar. NULL so envia."
  arg5:
    type: "PSIZE_T"
    name: "BufferLength"
    direction: "inout/opt"
    description: "Entra com o tamanho do buffer de recepcao e volta com o tamanho da mensagem recebida."
  arg6:
    type: "PALPC_MESSAGE_ATTRIBUTES"
    name: "ReceiveMessageAttributes"
    direction: "inout/opt"
    description: "Atributos do objeto. Opcional."
  arg7:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
