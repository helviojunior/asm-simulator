function_name: NtManageHotPatch
ssn: null
summary: ""
input_args:
  arg0:
    type: "HOT_PATCH_INFORMATION_CLASS"
    name: "HotPatchInformationClass"
    direction: "in"
    description: "Entrada: HOT_PATCH_INFORMATION_CLASS."
  arg1:
    type: "PVOID"
    name: "HotPatchInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg2:
    type: "ULONG"
    name: "HotPatchInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg3:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
