# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtQuerySystemTime
ssn: null
summary: "Hora do sistema em UTC. E a mesma leitura que RtlSystemTimeToLocalTime converte para o fuso local."
input_args:
  arg0:
    type: "PLARGE_INTEGER"
    name: "SystemTime"
    direction: "out"
    description: "Recebe a hora UTC em unidades de 100 ns desde 1 de janeiro de 1601."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
