    type: "ULONG"
    name: "CreateOptions"
    direction: "in"
    description: "FILE_SYNCHRONOUS_IO_NONALERT 0x20 faz a E/S ser sincrona."
  arg6:
    type: "HANDLE"
    name: "TransactionHandle"
    direction: "in"
    description: "Handle do objeto."
  arg7:
    type: "PULONG"
    name: "Disposition"
    direction: "out/opt"
    description: "Saida: PULONG. Opcional."
