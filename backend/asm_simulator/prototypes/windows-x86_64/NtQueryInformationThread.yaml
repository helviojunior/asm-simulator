# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtQueryInformationThread
ssn: null
summary: "Le uma propriedade de uma thread: TEB, endereco inicial, tempos, prioridade."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread. Exige THREAD_QUERY_LIMITED_INFORMATION ou THREAD_QUERY_INFORMATION. NtCurrentThread (-2) e a propria."
  arg1:
    type: "THREADINFOCLASS"
    name: "ThreadInformationClass"
    direction: "in"
    description: "O que ler (ThreadBasicInformation 0, ThreadTimes 1, ThreadQuerySetWin32StartAddress 9)."
  arg2:
    type: "PVOID"
    name: "ThreadInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "ULONG"
    name: "ThreadInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
