function_name: NtQueryMultipleValueKey
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "KeyHandle"
    direction: "in"
    description: "Handle da chave de registro."
  arg1:
    type: "PKEY_VALUE_ENTRY"
    name: "ValueEntries"
    direction: "inout"
    description: "Entra e sai: PKEY_VALUE_ENTRY."
  arg2:
    type: "ULONG"
    name: "EntryCount"
    direction: "in"
    description: "Quantidade de itens."
  arg3:
    type: "PVOID"
    name: "ValueBuffer"
    direction: "out"
    description: "Saida: PVOID."
  arg4:
    type: "PULONG"
    name: "BufferLength"
    direction: "inout"
    description: "Tamanho do buffer, em bytes."
  arg5:
    type: "PULONG"
    name: "RequiredBufferLength"
    direction: "out/opt"
    description: "Tamanho em bytes. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
