# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntmmapi.h
function_name: NtOpenSection
ssn: null
summary: "Abre uma secao existente pelo nome — o objeto por tras de todo mapeamento de arquivo em memoria."
input_args:
  arg0:
    type: "PHANDLE"
    name: "SectionHandle"
    direction: "out"
    description: "Handle da secao (objeto de memoria compartilhavel)."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Nome da secao. Obrigatorio: sem nome a chamada falha."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
