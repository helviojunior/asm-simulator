# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntlpcapi.h
function_name: NtAlpcAcceptConnectPort
ssn: null
summary: "Aceita (ou recusa) um pedido de conexao numa porta ALPC, devolvendo a porta de comunicacao com aquele cliente."
input_args:
  arg0:
    type: "PHANDLE"
    name: "PortHandle"
    direction: "out"
    description: "Recebe a porta SEM NOME que o servidor usa para falar com aquele cliente. So e criada se a conexao for aceita."
  arg1:
    type: "HANDLE"
    name: "ConnectionPortHandle"
    direction: "in"
    description: "Handle do objeto."
  arg2:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Normalmente 0. ALPC_PORFLG_WOW64_CALL (0x80000000) trata os handles como de 32 bits."
  arg3:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg4:
    type: "PALPC_PORT_ATTRIBUTES"
    name: "PortAttributes"
    direction: "in/opt"
    description: "Atributos do objeto. Opcional."
  arg5:
    type: "PVOID"
    name: "PortContext"
    direction: "in/opt"
    description: "Valor livre do servidor, guardado no objeto porta. Volta em ALPC_CONTEXT_ATTR nas mensagens recebidas daquele cliente."
  arg6:
    type: "PPORT_MESSAGE"
    name: "ConnectionRequest"
    direction: "in"
    description: "A mensagem de pedido de conexao recebida. Volta ao cliente na resposta — mesmo recusando, da para dizer por que."
  arg7:
    type: "PALPC_MESSAGE_ATTRIBUTES"
    name: "ConnectionMessageAttributes"
    direction: "inout/opt"
    description: "Atributos do objeto. Opcional."
  arg8:
    type: "BOOLEAN"
    name: "AcceptConnection"
    direction: "in"
    description: "TRUE aceita a conexao; FALSE recusa e a porta de comunicacao nao e criada."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
