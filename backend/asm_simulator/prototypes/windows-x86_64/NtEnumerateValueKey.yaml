# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtEnumerateValueKey
ssn: null
summary: "Le o valor de indice N de uma chave de registro. E assim que se percorrem os valores: um por chamada."
input_args:
  arg0:
    type: "HANDLE"
    name: "KeyHandle"
    direction: "in"
    description: "Handle da chave de registro."
  arg1:
    type: "ULONG"
    name: "Index"
    direction: "in"
    description: "Indice do valor, de 0 em diante. STATUS_NO_MORE_ENTRIES marca o fim."
  arg2:
    type: "KEY_VALUE_INFORMATION_CLASS"
    name: "KeyValueInformationClass"
    direction: "in"
    description: "Formato do resultado (KeyValueBasicInformation 0, KeyValueFullInformation 1, KeyValuePartialInformation 2)."
  arg3:
    type: "PVOID"
    name: "KeyValueInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg4:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg5:
    type: "PULONG"
    name: "ResultLength"
    direction: "out"
    description: "Recebe o tamanho necessario. Com KeyValueInformation NULL e Length 0, mede antes de alocar."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "STATUS_NO_MORE_ENTRIES marca o fim da enumeracao. STATUS_BUFFER_TOO_SMALL pede um buffer do tamanho de ResultLength."
