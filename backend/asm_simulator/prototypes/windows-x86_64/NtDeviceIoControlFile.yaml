# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntioapi.h
function_name: NtDeviceIoControlFile
ssn: null
summary: "Envia um IOCTL a um driver."
input_args:
  arg0:
    type: "HANDLE"
    name: "FileHandle"
    direction: "in"
    description: "Handle do arquivo."
  arg1:
    type: "HANDLE"
    name: "Event"
    direction: "in/opt"
    description: "Evento sinalizado ao fim de uma operacao assincrona. NULL e o comum."
  arg2:
    type: "PIO_APC_ROUTINE"
    name: "ApcRoutine"
    direction: "in/opt"
    description: "Rotina de conclusao assincrona. NULL e o comum."
  arg3:
    type: "PVOID"
    name: "ApcContext"
    direction: "in/opt"
    description: "Valor entregue a ApcRoutine. Opcional."
  arg4:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg5:
    type: "ULONG"
    name: "IoControlCode"
    direction: "in"
    description: "Codigo do IOCTL. Define o que o driver faz e o formato dos buffers."
  arg6:
    type: "PVOID"
    name: "InputBuffer"
    direction: "in/opt"
    description: "Entrada: PVOID. Opcional."
  arg7:
    type: "ULONG"
    name: "InputBufferLength"
    direction: "in"
    description: "Tamanho em bytes."
  arg8:
    type: "PVOID"
    name: "OutputBuffer"
    direction: "out/opt"
    description: "Saida: PVOID. Opcional."
  arg9:
    type: "ULONG"
    name: "OutputBufferLength"
    direction: "in"
    description: "Tamanho em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
