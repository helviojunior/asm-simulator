function_name: NtWaitForKeyedEvent
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "KeyedEventHandle"
    direction: "in/opt"
    description: "Handle do objeto. Opcional."
  arg1:
    type: "PVOID"
    name: "KeyValue"
    direction: "in"
    description: "Entrada: PVOID."
  arg2:
    type: "BOOLEAN"
    name: "Alertable"
    direction: "in"
    description: "TRUE permite que uma APC interrompa a espera."
  arg3:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
