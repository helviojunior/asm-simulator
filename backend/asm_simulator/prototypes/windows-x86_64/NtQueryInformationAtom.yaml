function_name: NtQueryInformationAtom
ssn: null
summary: ""
input_args:
  arg0:
    type: "RTL_ATOM"
    name: "Atom"
    direction: "in"
    description: "Entrada: RTL_ATOM."
  arg1:
    type: "ATOM_INFORMATION_CLASS"
    name: "AtomInformationClass"
    direction: "in"
    description: "Entrada: ATOM_INFORMATION_CLASS."
  arg2:
    type: "PVOID"
    name: "AtomInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "ULONG"
    name: "AtomInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
