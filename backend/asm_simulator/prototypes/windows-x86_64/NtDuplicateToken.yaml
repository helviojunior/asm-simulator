    type: "BOOLEAN"
    name: "EffectiveOnly"
    direction: "in"
    description: "Entrada: BOOLEAN."
  arg4:
    type: "TOKEN_TYPE"
    name: "Type"
    direction: "in"
    description: "Entrada: TOKEN_TYPE."
  arg5:
    type: "PHANDLE"
    name: "NewTokenHandle"
    direction: "out"
    description: "Handle do objeto."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
