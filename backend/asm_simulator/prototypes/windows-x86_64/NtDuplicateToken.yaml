# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntseapi.h
function_name: NtDuplicateToken
ssn: null
summary: "Duplica um token, trocando o tipo (primario ou de impersonation) e o nivel de impersonation."
input_args:
  arg0:
    type: "HANDLE"
    name: "ExistingTokenHandle"
    direction: "in"
    description: "Token a duplicar. O handle precisa de TOKEN_DUPLICATE."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do handle, descritor de seguranca e — no SecurityQualityOfService — o nivel de impersonation do novo token."
  arg3:
    type: "BOOLEAN"
    name: "EffectiveOnly"
    direction: "in"
    description: "TRUE descarta do novo token os grupos e privilegios desabilitados — e uma perda irreversivel."
  arg4:
    type: "TOKEN_TYPE"
    name: "Type"
    direction: "in"
    description: "TokenPrimary 1 ou TokenImpersonation 2. E aqui que um token de impersonation vira primario, para criar processo."
  arg5:
    type: "PHANDLE"
    name: "NewTokenHandle"
    direction: "out"
    description: "Handle do objeto."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
