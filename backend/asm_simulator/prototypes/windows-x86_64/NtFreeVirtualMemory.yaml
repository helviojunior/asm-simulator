# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntmmapi.h
function_name: NtFreeVirtualMemory
ssn: null
summary: "Libera memoria virtual."
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PVOID *"
    name: "BaseAddress"
    direction: "inout"
    description: "Endereco base da regiao."
  arg2:
    type: "PSIZE_T"
    name: "RegionSize"
    direction: "inout"
    description: "Tamanho da regiao, em bytes."
  arg3:
    type: "ULONG"
    name: "FreeType"
    direction: "in"
    description: "MEM_DECOMMIT 0x4000 devolve as paginas; MEM_RELEASE 0x8000 libera a reserva."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
