# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtWaitForMultipleObjects
ssn: null
summary: "Espera por varios objetos de uma vez: por todos (WaitAll) ou pelo primeiro que sinalizar (WaitAny)."
input_args:
  arg0:
    type: "ULONG"
    name: "Count"
    direction: "in"
    description: "Quantos handles ha no vetor. No maximo 64."
  arg1:
    type: "HANDLE"
    name: "Handles[]"
    direction: "in"
    description: "Vetor com Count handles. E um ponteiro para o inicio do vetor, nao um handle."
  arg2:
    type: "WAIT_TYPE"
    name: "WaitType"
    direction: "in"
    description: "WaitAll 0 espera por todos; WaitAny 1 volta no primeiro que sinalizar, e o status diz qual foi (0..Count-1)."
  arg3:
    type: "BOOLEAN"
    name: "Alertable"
    direction: "in"
    description: "TRUE permite que uma APC interrompa a espera."
  arg4:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Negativo e relativo ao agora, em unidades de 100 ns; positivo e absoluto (desde 1601); NULL espera para sempre."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "Com WaitAny, o valor de 0 a 63 (STATUS_WAIT_0..63) diz QUAL objeto sinalizou; 0x80 + n indica mutante abandonado. STATUS_TIMEOUT (0x102) quando o tempo acabou."
