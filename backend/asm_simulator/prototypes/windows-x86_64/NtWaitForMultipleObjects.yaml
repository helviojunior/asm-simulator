function_name: NtWaitForMultipleObjects
ssn: null
summary: ""
input_args:
  arg0:
    type: "ULONG"
    name: "Count"
    direction: "in"
    description: "Quantidade de itens."
  arg1:
    type: "HANDLE"
    name: "Handles[]"
    direction: "in"
    description: "Entrada: HANDLE."
  arg2:
    type: "WAIT_TYPE"
    name: "WaitType"
    direction: "in"
    description: "Entrada: WAIT_TYPE."
  arg3:
    type: "BOOLEAN"
    name: "Alertable"
    direction: "in"
    description: "TRUE permite que uma APC interrompa a espera."
  arg4:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
