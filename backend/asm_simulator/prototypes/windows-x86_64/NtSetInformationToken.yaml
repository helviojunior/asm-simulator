# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntseapi.h
function_name: NtSetInformationToken
ssn: null
summary: "Altera uma propriedade de um token: dono, DACL padrao, nivel de integridade."
input_args:
  arg0:
    type: "HANDLE"
    name: "TokenHandle"
    direction: "in"
    description: "Handle do token. Exige TOKEN_ADJUST_DEFAULT (ou o direito especifico da classe)."
  arg1:
    type: "TOKEN_INFORMATION_CLASS"
    name: "TokenInformationClass"
    direction: "in"
    description: "O que alterar (TokenOwner 4, TokenDefaultDacl 6, TokenIntegrityLevel 25)."
  arg2:
    type: "PVOID"
    name: "TokenInformation"
    direction: "in"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "ULONG"
    name: "TokenInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
