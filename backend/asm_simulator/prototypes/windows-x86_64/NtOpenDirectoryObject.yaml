# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntobapi.h
function_name: NtOpenDirectoryObject
ssn: null
summary: "Abre um diretorio do namespace de objetos (\\BaseNamedObjects, \\Device)."
input_args:
  arg0:
    type: "PHANDLE"
    name: "DirectoryHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "DIRECTORY_QUERY 1 para listar, DIRECTORY_TRAVERSE 2 para atravessar."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Nome do diretorio (ex.: \"\\\", \"\\BaseNamedObjects\"). Obrigatorio: sem nome nao ha o que abrir."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
