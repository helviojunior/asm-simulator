# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntseapi.h
function_name: NtCreateToken
ssn: null
summary: "Fabrica um token de acesso do zero, campo a campo. Exige o privilegio SeCreateTokenPrivilege, que normalmente so o Lsass.exe tem."
input_args:
  arg0:
    type: "PHANDLE"
    name: "TokenHandle"
    direction: "out"
    description: "Handle do token de acesso."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "TOKEN_TYPE"
    name: "Type"
    direction: "in"
    description: "TokenPrimary 1 anexa a um processo; TokenImpersonation 2 anexa a uma thread. (No livro: TokenType.)"
  arg4:
    type: "PLUID"
    name: "AuthenticationId"
    direction: "in"
    description: "LUID de uma sessao de logon que JA EXISTE: 999 (0x3E7) LocalSystem, 997 LocalService, 996 NetworkService."
  arg5:
    type: "PLARGE_INTEGER"
    name: "ExpirationTime"
    direction: "in"
    description: "Quando o token expira, em unidades de 100 ns. Um valor com todos os bits em 1 significa nunca."
  arg6:
    type: "PTOKEN_USER"
    name: "User"
    direction: "in"
    description: "SID do usuario dono do token."
  arg7:
    type: "PTOKEN_GROUPS"
    name: "Groups"
    direction: "in"
    description: "Grupos do token, cada um com seus atributos. E onde entra o nivel de integridade."
  arg8:
    type: "PTOKEN_PRIVILEGES"
    name: "Privileges"
    direction: "in"
    description: "Privilegios do token e quais nascem habilitados."
  arg9:
    type: "PTOKEN_OWNER"
    name: "Owner"
    direction: "in/opt"
    description: "SID que sera dono dos objetos criados. NULL usa o proprio usuario."
  arg10:
    type: "PTOKEN_PRIMARY_GROUP"
    name: "PrimaryGroup"
    direction: "in"
    description: "SID do grupo primario, herdado pelos objetos criados."
  arg11:
    type: "PTOKEN_DEFAULT_DACL"
    name: "DefaultDacl"
    direction: "in/opt"
    description: "DACL aplicada aos objetos criados sem descritor proprio. Opcional."
  arg12:
    type: "PTOKEN_SOURCE"
    name: "Source"
    direction: "in"
    description: "Origem do token: oito caracteres de nome mais um LUID. Aparece nas auditorias. (No livro este parametro chama-se TokenSource.)"
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
