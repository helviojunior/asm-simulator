# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtQuerySystemInformation
ssn: null
summary: "Consulta informacao do sistema, como a lista de processos."
input_args:
  arg0:
    type: "SYSTEM_INFORMATION_CLASS"
    name: "SystemInformationClass"
    direction: "in"
    description: "SystemProcessInformation 5 lista os processos — o caminho para achar um PID."
  arg1:
    type: "PVOID"
    name: "SystemInformation"
    direction: "out/opt"
    description: "Bloco de informacao. O formato depende da classe pedida. Opcional."
  arg2:
    type: "ULONG"
    name: "SystemInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg3:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho realmente necessario. Util para chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
