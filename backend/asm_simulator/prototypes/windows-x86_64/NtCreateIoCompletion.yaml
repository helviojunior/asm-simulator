# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntioapi.h
function_name: NtCreateIoCompletion
ssn: null
summary: "Cria uma porta de conclusao de E/S, onde as operacoes assincronas depositam o resultado."
input_args:
  arg0:
    type: "PHANDLE"
    name: "IoCompletionHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto. IO_COMPLETION_ALL_ACCESS e o tipico."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "ULONG"
    name: "NumberOfConcurrentThreads"
    direction: "in/opt"
    description: "Quantas threads no maximo tratam conclusoes ao mesmo tempo. 0 usa o numero de processadores LOGICOS."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
