function_name: NtOpenPrivateNamespace
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "NamespaceHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "POBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "POBJECT_BOUNDARY_DESCRIPTOR"
    name: "BoundaryDescriptor"
    direction: "in"
    description: "Entrada: POBJECT_BOUNDARY_DESCRIPTOR."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
