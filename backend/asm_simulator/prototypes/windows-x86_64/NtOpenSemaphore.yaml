# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntexapi.h
function_name: NtOpenSemaphore
ssn: null
summary: "Abre um semaforo existente pelo nome."
input_args:
  arg0:
    type: "PHANDLE"
    name: "SemaphoreHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in"
    description: "Nome do semaforo. Obrigatorio: sem nome a chamada falha."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
