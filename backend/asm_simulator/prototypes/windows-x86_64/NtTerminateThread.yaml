# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtTerminateThread
ssn: null
summary: "Encerra uma thread."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in/opt"
    description: "Handle da thread alvo. Opcional."
  arg1:
    type: "NTSTATUS"
    name: "ExitStatus"
    direction: "in"
    description: "Codigo de saida."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
