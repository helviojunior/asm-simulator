    type: "PVOID"
    name: "NlsTableOffset"
    direction: "in/opt"
    description: "Deslocamento em bytes. Opcional."
  arg5:
    type: "PVOID"
    name: "KeyboardDescriptor"
    direction: "in/opt"
    description: "Entrada: PVOID. Opcional."
  arg6:
    type: "PCUNICODE_STRING"
    name: "LanguageIdString"
    direction: "in/opt"
    description: "Entrada: PCUNICODE_STRING. Opcional."
  arg7:
    type: "ULONG"
    name: "KeyboardLocale"
    direction: "in/opt"
    description: "Entrada: ULONG. Opcional."
