function_name: NtGetNextThread
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in/opt"
    description: "Handle da thread alvo. NtCurrentThread (-2) e a propria. Opcional."
  arg2:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg3:
    type: "ULONG"
    name: "HandleAttributes"
    direction: "in"
    description: "Atributos do objeto."
  arg4:
    type: "ULONG"
    name: "Flags"
    direction: "in/opt"
    description: "Combinacao de flags. Opcional."
  arg5:
    type: "PHANDLE"
    name: "NewThreadHandle"
    direction: "out"
    description: "Handle do objeto."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
