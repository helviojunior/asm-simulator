function_name: NtCreateThreadStateChange
ssn: null
summary: ""
input_args:
  arg0:
    type: "PHANDLE"
    name: "ThreadStateChangeHandle"
    direction: "out"
    description: "Handle do objeto."
  arg1:
    type: "ACCESS_MASK"
    name: "DesiredAccess"
    direction: "in"
    description: "Direitos pedidos sobre o objeto."
  arg2:
    type: "PCOBJECT_ATTRIBUTES"
    name: "ObjectAttributes"
    direction: "in/opt"
    description: "Atributos do objeto: nome em UNICODE_STRING, diretorio raiz e flags. Opcional."
  arg3:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread alvo. NtCurrentThread (-2) e a propria."
  arg4:
    type: "ULONG"
    name: "Reserved"
    direction: "in/opt"
    description: "Entrada: ULONG. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
