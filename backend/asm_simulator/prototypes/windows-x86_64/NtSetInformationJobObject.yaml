function_name: NtSetInformationJobObject
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "JobHandle"
    direction: "in"
    description: "Handle do objeto."
  arg1:
    type: "JOBOBJECTINFOCLASS"
    name: "JobObjectInformationClass"
    direction: "in"
    description: "Entrada: JOBOBJECTINFOCLASS."
  arg2:
    type: "PVOID"
    name: "JobObjectInformation"
    direction: "in"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "ULONG"
    name: "JobObjectInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
