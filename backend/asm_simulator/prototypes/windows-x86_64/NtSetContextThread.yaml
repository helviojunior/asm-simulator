# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntpsapi.h
function_name: NtSetContextThread
ssn: null
summary: "Escreve os registradores de uma thread. Permite desviar a execucao dela."
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread alvo."
  arg1:
    type: "PCONTEXT"
    name: "ThreadContext"
    direction: "in"
    description: "Estrutura CONTEXT com o estado dos registradores."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
