# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntioapi.h
function_name: NtQueryEaFile
ssn: null
summary: "Le os atributos estendidos (EA) de um arquivo."
input_args:
  arg0:
    type: "HANDLE"
    name: "FileHandle"
    direction: "in"
    description: "Handle do arquivo."
  arg1:
    type: "PIO_STATUS_BLOCK"
    name: "IoStatusBlock"
    direction: "out"
    description: "Recebe o status da operacao e a quantidade de bytes transferidos."
  arg2:
    type: "PVOID"
    name: "Buffer"
    direction: "out"
    description: "Recebe uma cadeia de FILE_FULL_EA_INFORMATION, ligada por NextEntryOffset."
  arg3:
    type: "ULONG"
    name: "Length"
    direction: "in"
    description: "Tamanho do buffer, em bytes."
  arg4:
    type: "BOOLEAN"
    name: "ReturnSingleEntry"
    direction: "in"
    description: "TRUE devolve um EA por chamada; FALSE enche o buffer."
  arg5:
    type: "PVOID"
    name: "EaList"
    direction: "in/opt"
    description: "Lista de nomes de EA a devolver. NULL devolve todos."
  arg6:
    type: "ULONG"
    name: "EaListLength"
    direction: "in"
    description: "Tamanho em bytes."
  arg7:
    type: "PULONG"
    name: "EaIndex"
    direction: "in/opt"
    description: "Indice do EA a devolver. NULL comeca do primeiro."
  arg8:
    type: "BOOLEAN"
    name: "RestartScan"
    direction: "in"
    description: "TRUE recomeca do primeiro EA; FALSE continua de onde parou. IGNORADO na primeira chamada com aquele handle."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
