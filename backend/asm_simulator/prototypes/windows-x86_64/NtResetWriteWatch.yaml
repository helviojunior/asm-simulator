function_name: NtResetWriteWatch
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "PVOID"
    name: "BaseAddress"
    direction: "in"
    description: "Endereco base da regiao de memoria."
  arg2:
    type: "SIZE_T"
    name: "RegionSize"
    direction: "in"
    description: "Tamanho da regiao, em bytes."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
