function_name: NtGetWriteWatch
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ProcessHandle"
    direction: "in"
    description: "Handle do processo alvo. NtCurrentProcess (-1) e o proprio."
  arg1:
    type: "ULONG"
    name: "Flags"
    direction: "in"
    description: "Combinacao de flags."
  arg2:
    type: "PVOID"
    name: "BaseAddress"
    direction: "in"
    description: "Endereco base da regiao de memoria."
  arg3:
    type: "SIZE_T"
    name: "RegionSize"
    direction: "in"
    description: "Tamanho da regiao, em bytes."
  arg4:
    type: "PVOID *"
    name: "UserAddressArray"
    direction: "out"
    description: "Saida: PVOID *."
  arg5:
    type: "PULONG_PTR"
    name: "EntriesInUserAddressArray"
    direction: "inout"
    description: "Entra e sai: PULONG_PTR."
  arg6:
    type: "PULONG"
    name: "Granularity"
    direction: "out"
    description: "Saida: PULONG."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
