# Prototipo de syscall. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntregapi.h
function_name: NtLoadKey
ssn: null
summary: "Monta um arquivo de hive como subarvore do registro. O arquivo vira o backing store da chave — diferente de NtRestoreKey, que so copia o conteudo. Exige SE_RESTORE_NAME."
input_args:
  arg0:
    type: "POBJECT_ATTRIBUTES"
    name: "TargetKey"
    direction: "in"
    description: "Onde montar, em OBJECT_ATTRIBUTES. Tem de ficar sob \\Registry\\Machine ou \\Registry\\User."
  arg1:
    type: "POBJECT_ATTRIBUTES"
    name: "SourceFile"
    direction: "in"
    description: "Arquivo de hive a montar, em OBJECT_ATTRIBUTES. E um arquivo gravado antes por NtSaveKey."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
