function_name: NtQuerySection
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "SectionHandle"
    direction: "in"
    description: "Handle da secao (objeto de memoria compartilhavel)."
  arg1:
    type: "SECTION_INFORMATION_CLASS"
    name: "SectionInformationClass"
    direction: "in"
    description: "Entrada: SECTION_INFORMATION_CLASS."
  arg2:
    type: "PVOID"
    name: "SectionInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "SIZE_T"
    name: "SectionInformationLength"
    direction: "in"
    description: "Tamanho do bloco de informacao, em bytes."
  arg4:
    type: "PSIZE_T"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
