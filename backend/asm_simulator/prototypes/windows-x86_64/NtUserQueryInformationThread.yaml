function_name: NtUserQueryInformationThread
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "ThreadHandle"
    direction: "in"
    description: "Handle da thread alvo. NtCurrentThread (-2) e a propria."
  arg1:
    type: "USERTHREADINFOCLASS"
    name: "ThreadInformationClass"
    direction: "in"
    description: "Entrada: USERTHREADINFOCLASS."
  arg2:
    type: "PVOID"
    name: "ThreadInformation"
    direction: "out"
    description: "Bloco de informacao. O formato depende da classe pedida."
  arg3:
    type: "PULONG"
    name: "ReturnLength"
    direction: "out/opt"
    description: "Recebe o tamanho necessario. Permite chamar duas vezes: uma para medir, outra para ler. Opcional."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
