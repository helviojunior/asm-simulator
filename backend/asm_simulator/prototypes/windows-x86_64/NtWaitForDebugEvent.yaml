function_name: NtWaitForDebugEvent
ssn: null
summary: ""
input_args:
  arg0:
    type: "HANDLE"
    name: "DebugObjectHandle"
    direction: "in"
    description: "Handle do objeto."
  arg1:
    type: "BOOLEAN"
    name: "Alertable"
    direction: "in"
    description: "TRUE permite que uma APC interrompa a espera."
  arg2:
    type: "PLARGE_INTEGER"
    name: "Timeout"
    direction: "in/opt"
    description: "Tempo limite em unidades de 100ns. Negativo e relativo ao agora; NULL espera para sempre."
  arg3:
    type: "PDBGUI_WAIT_STATE_CHANGE"
    name: "WaitStateChange"
    direction: "out"
    description: "Saida: PDBGUI_WAIT_STATE_CHANGE."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
