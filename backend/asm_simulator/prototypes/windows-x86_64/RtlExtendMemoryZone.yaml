# Prototipo de funcao de modo usuario da ntdll. Ver prototypes/README.md.
# Assinatura extraida dos headers do projeto phnt (MIT):
#   https://github.com/winsiderss/phnt — ntrtl.h
function_name: RtlExtendMemoryZone
kind: function
ssn: null
summary: "Acrescenta espaco a uma zona que encheu."
input_args:
  arg0:
    type: "PVOID"
    name: "MemoryZone"
    direction: "in"
    description: "Zona a estender."
  arg1:
    type: "SIZE_T"
    name: "Increment"
    direction: "in"
    description: "Quantos bytes acrescentar."
output_data:
  type: "NTSTATUS"
  name: "status"
  description: "0 (STATUS_SUCCESS) em sucesso. Valores altos (0x8..., 0xC...) indicam erro."
