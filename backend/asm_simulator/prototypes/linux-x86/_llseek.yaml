    description: "Metade BAIXA do deslocamento de 64 bits."
  arg3:
    type: "loff_t *"
    name: "result"
    description: "Recebe a posicao final, ja em 64 bits."
  arg4:
    type: "unsigned int"
    name: "whence"
    description: "Origem do deslocamento: SEEK_SET 0, SEEK_CUR 1, SEEK_END 2."
output_data:
  type: "long"
