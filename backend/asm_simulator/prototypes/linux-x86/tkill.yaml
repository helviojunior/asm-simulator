# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_32.h
# Assinatura: man 2 tkill
function_name: tkill
ssn: 238
summary: "Envia um sinal a UMA thread, pelo TID."
input_args:
  arg0:
    type: "pid_t"
    name: "tid"
    description: "TID da thread alvo — nao o PID. E o que permite sinalizar UMA thread."
  arg1:
    type: "int"
    name: "sig"
    description: "Numero do sinal. SIGKILL 9, SIGTERM 15."
output_data:
  type: "long"
  name: "result"
  description: "Valor de retorno; negativo em erro (-errno)."
