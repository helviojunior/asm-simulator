# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_32.h
# Assinatura: man 2 read
function_name: read
ssn: 3
summary: "Le ate `count` bytes de `fd` para `buf`."
input_args:
  arg0:
    type: "int"
    name: "fd"
    description: "Descritor de arquivo aberto. 0 stdin, 1 stdout, 2 stderr."
  arg1:
    type: "void *"
    name: "buf"
    description: "Ponteiro para onde os bytes lidos serao gravados."
  arg2:
    type: "size_t"
    name: "count"
    description: "Quantidade de bytes. Nao ha terminador: o tamanho e explicito."
output_data:
  type: "ssize_t"
  name: "read"
  description: "Bytes lidos, 0 no fim do arquivo, negativo em erro (-errno)."
