# Assinatura: man 2 exit
function_name: exit
ssn: 1
summary: "Encerra a thread chamadora com o codigo dado. Em programa de uma thread so, e o fim do processo."
input_args:
  arg0:
    type: "int"
    name: "status"
    description: "Codigo de saida da thread. So os 8 bits baixos chegam a quem espera — exit(256) e visto como 0."
output_data:
  type: "void"
  name: "none"
  description: "Nao retorna."
