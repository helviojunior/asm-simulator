# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_32.h
# Assinatura: man 2 fstat (a pagina do syscall `fstat64` esta sob esse nome)
function_name: fstat64
ssn: 197
summary: "Metadados de um arquivo ja aberto, com campos de 64 bits."
input_args:
  arg0:
    type: "int"
    name: "fd"
    description: "Descritor de arquivo aberto. 0 stdin, 1 stdout, 2 stderr."
  arg1:
    type: "struct stat *"
    name: "statbuf"
    description: "Recebe a struct stat com os metadados do arquivo."
output_data:
  type: "long"
  name: "result"
  description: "Valor de retorno; negativo em erro (-errno)."
