# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_32.h
# Assinatura: man 2 write
function_name: write
ssn: 4
summary: "Escreve `count` bytes de `buf` em `fd`. E a saida visivel da maioria dos exercicios."
input_args:
  arg0:
    type: "int"
    name: "fd"
    description: "Descritor de arquivo aberto. 0 stdin, 1 stdout, 2 stderr."
  arg1:
    type: "const void *"
    name: "buf"
    description: "Ponteiro para os bytes a escrever."
  arg2:
    type: "size_t"
    name: "count"
    description: "Quantidade de bytes. Nao ha terminador: o tamanho e explicito."
output_data:
  type: "ssize_t"
  name: "written"
  description: "Bytes escritos, ou negativo em erro (-errno)."
