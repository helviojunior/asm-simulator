# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_32.h
# Assinatura: man 2 mmap2
function_name: mmap2
ssn: 192
summary: "Mapeia memoria como mmap, mas com o deslocamento em PAGINAS — e assim que o i386 alcanca arquivos alem de 4 GB."
input_args:
  arg0:
    type: "unsigned long"
    name: "addr"
    description: "Endereco sugerido. 0 deixa o kernel escolher."
  arg1:
    type: "unsigned long"
    name: "length"
    description: "Tamanho do mapeamento, em bytes."
  arg2:
    type: "unsigned long"
    name: "prot"
    description: "Protecao da memoria: PROT_READ 1, PROT_WRITE 2, PROT_EXEC 4."
  arg3:
    type: "unsigned long"
    name: "flags"
    description: "MAP_SHARED 1, MAP_PRIVATE 2, MAP_ANONYMOUS 0x20 (sem arquivo), MAP_FIXED 0x10."
  arg4:
    type: "unsigned long"
    name: "fd"
    description: "Arquivo a mapear. Com MAP_ANONYMOUS, -1."
  arg5:
    type: "unsigned long"
    name: "pgoffset"
    description: "Deslocamento no arquivo em PAGINAS de 4 KB, e nao em bytes. E toda a diferenca entre mmap2 e mmap."
output_data:
  type: "void *"
  name: "addr"
  description: "Endereco do mapeamento, ou valor negativo pequeno em erro (-errno)."
