# Prototipo de TIPO. Ver prototypes/README.md.
# Tipo da API do Windows (nao da API nativa, entao nao esta no phnt).
# Offsets conferidos pelo compilador: ver types/probes/win32.c —
# valor errado ali nao compila.
type_name: sockaddr_in
kind: struct
size: 16
align: 4
summary: "Endereco IPv4 de um socket — igual em Windows e Linux. A porta e o IP ficam em BIG-endian."
fields:
  field0:
    type: "short"
    name: "sin_family"
    offset: 0
    size: 2
    description: "AF_INET (2). Em little-endian, os dois bytes saem como 02 00."
  field1:
    type: "u_short"
    name: "sin_port"
    offset: 2
    size: 2
    description: "Porta em BIG-endian: 4444 e 0x5C11 na memoria, e nao 0x115C."
  field2:
    type: "struct in_addr"
    name: "sin_addr"
    offset: 4
    size: 4
    description: "IPv4 em big-endian. 127.0.0.1 e 0x0100007F na memoria."
  field3:
    type: "char[8]"
    name: "sin_zero"
    offset: 8
    size: 8
    description: "Preenchimento, para o tamanho bater com sockaddr."
