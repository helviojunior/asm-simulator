# Prototipo de TIPO. Ver prototypes/README.md.
# Layout medido pelo compilador (offsetof), com -m32.
type_name: timeval
kind: struct
size: 8
align: 4
summary: "Instante ou intervalo, em segundos e microssegundos."
fields:
  field0:
    type: "time_t"
    name: "tv_sec"
    offset: 0
    size: 4
    description: "Segundos."
  field1:
    type: "suseconds_t"
    name: "tv_usec"
    offset: 4
    size: 4
    description: "Microssegundos (0 a 999999)."
