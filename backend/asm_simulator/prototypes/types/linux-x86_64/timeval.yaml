# Prototipo de TIPO. Ver prototypes/README.md.
# Layout medido pelo compilador (offsetof), com -m64.
type_name: timeval
kind: struct
size: 16
align: 8
summary: "Instante ou intervalo, em segundos e microssegundos."
fields:
  field0:
    type: "time_t"
    name: "tv_sec"
    offset: 0
    size: 8
    description: "Segundos."
  field1:
    type: "suseconds_t"
    name: "tv_usec"
    offset: 8
    size: 8
    description: "Microssegundos (0 a 999999)."
