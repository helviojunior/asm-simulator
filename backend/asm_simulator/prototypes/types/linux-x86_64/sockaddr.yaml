# Prototipo de TIPO. Ver prototypes/README.md.
# Layout medido pelo compilador (offsetof), com -m64.
type_name: sockaddr
kind: struct
size: 16
align: 2
summary: "Forma generica de endereco de socket; o campo de familia diz qual estrutura de verdade esta ali."
variants:
  # `sockaddr` e generico: o layout de verdade sai da familia. Numeros do
  # Linux — AF_UNIX 1, AF_INET 2, AF_INET6 10.
  field: sa_family
  cases:
    1: sockaddr_un
    2: sockaddr_in
    10: sockaddr_in6
fields:
  field0:
    type: "sa_family_t"
    name: "sa_family"
    offset: 0
    size: 2
    description: "Familia do endereco: AF_INET 2, AF_INET6 10, AF_UNIX 1."
  field1:
    type: "char[]"
    name: "sa_data"
    offset: 2
    size: 14
    description: "Conteudo do endereco; o formato depende da familia."
