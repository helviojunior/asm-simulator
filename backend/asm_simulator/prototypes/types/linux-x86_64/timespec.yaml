# Prototipo de TIPO. Ver prototypes/README.md.
# Layout medido pelo compilador (offsetof), com -m64.
type_name: timespec
kind: struct
size: 16
align: 8
summary: "Instante ou intervalo, em segundos e nanossegundos."
fields:
  field0:
    type: "time_t"
    name: "tv_sec"
    offset: 0
    size: 8
    description: "Segundos."
  field1:
    type: "long"
    name: "tv_nsec"
    offset: 8
    size: 8
    description: "Nanossegundos (0 a 999999999)."
