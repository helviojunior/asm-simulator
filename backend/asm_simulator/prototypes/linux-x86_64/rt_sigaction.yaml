# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_64.h
# Assinatura: man 2 sigaction (a pagina do syscall `rt_sigaction` esta sob esse nome)
# Argumentos da SYSCALL crua, da secao "C library/kernel differences".
function_name: rt_sigaction
ssn: 13
summary: "Instala o tratador de um sinal. Versao real da syscall: leva o tamanho do conjunto de sinais a mais que o sigaction da libc."
input_args:
  arg0:
    type: "int"
    name: "signum"
    description: "Numero do sinal. SIGKILL 9 e SIGSTOP 19 nao podem ser capturados."
  arg1:
    type: "const struct sigaction *"
    name: "act"
    description: "Novo tratador do sinal. NULL so consulta."
  arg2:
    type: "struct sigaction *"
    name: "oldact"
    description: "Recebe o tratador anterior. NULL descarta."
  arg3:
    type: "size_t"
    name: "sigsetsize"
    description: "Tamanho em bytes do conjunto de sinais (8 no x86-64, 8 no i386). E o argumento que a versao rt_ tem a mais que o wrapper da libc."
output_data:
  type: "long"
  name: "result"
  description: "Valor de retorno; negativo em erro (-errno)."
