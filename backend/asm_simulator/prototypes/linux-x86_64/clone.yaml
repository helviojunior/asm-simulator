# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_64.h
# Assinatura: man 2 clone
# Argumentos da SYSCALL crua, da secao "C library/kernel differences".
function_name: clone
ssn: 56
summary: "Cria um processo ou thread, escolhendo o que e compartilhado com o pai. E a base de fork() e de pthread_create()."
input_args:
  arg0:
    type: "unsigned long"
    name: "flags"
    description: "O que o filho COMPARTILHA com o pai: CLONE_VM 0x100 (memoria), CLONE_FS 0x200, CLONE_FILES 0x400, CLONE_SIGHAND 0x800, CLONE_THREAD 0x10000. No byte baixo vai o sinal enviado ao pai na saida (SIGCHLD 17)."
  arg1:
    type: "void *"
    name: "stack"
    description: "Topo da pilha da thread nova — o endereco MAIS ALTO, porque a pilha cresce para baixo."
  arg2:
    type: "int *"
    name: "parent_tid"
    description: "Endereco onde o kernel escreve o TID do filho, no espaco do PAI."
  arg3:
    type: "int *"
    name: "child_tid"
    description: "Endereco onde o kernel escreve o TID do filho, no espaco do FILHO."
  arg4:
    type: "unsigned long"
    name: "tls"
    description: "Novo valor do descritor de TLS da thread."
output_data:
  type: "int"
  name: "pid"
  description: "No PAI, o PID do filho; no FILHO, 0. Negativo em erro (-errno). E o unico retorno que sai duas vezes."
