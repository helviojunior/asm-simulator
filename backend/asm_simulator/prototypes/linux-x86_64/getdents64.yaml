# Prototipo de syscall. Ver prototypes/README.md.
# Numero: /usr/include/x86_64-linux-gnu/asm/unistd_64.h
# Assinatura: man 2 getdents64
function_name: getdents64
ssn: 217
summary: "Le entradas de um diretorio aberto. E o motor de readdir()."
input_args:
  arg0:
    type: "int"
    name: "fd"
    description: "Descritor de arquivo aberto. 0 stdin, 1 stdout, 2 stderr."
  arg1:
    type: "void *"
    name: "dirp"
    description: "Recebe as entradas do diretorio: cada uma traz o tamanho da proxima, e e assim que se anda pelo buffer."
  arg2:
    type: "size_t"
    name: "count"
    description: "Quantidade de bytes."
output_data:
  type: "long"
  name: "result"
  description: "Valor de retorno; negativo em erro (-errno)."
