function_name: prlimit64
ssn: 302
summary: ""
input_args:
  arg0:
    type: "pid_t"
    name: "pid"
    description: "Identificador do processo. 0 significa o processo atual."
  arg1:
    type: "int"
    name: "resource"
    description: "Qual limite: RLIMIT_NOFILE 7, RLIMIT_STACK 3, RLIMIT_CORE 4."
  arg2:
    type: "const struct rlimit *"
    name: "new_limit"
    description: "Novo par (limite flexivel, limite rigido). NULL so consulta."
  arg3:
    type: "struct rlimit *"
    name: "old_limit"
    description: "Recebe o par anterior. NULL descarta."
output_data:
  type: "long"
  name: "result"
  description: "Valor de retorno; negativo em erro (-errno)."
