# Blocos de rota compartilhados entre os servidores HTTP e HTTPS.
# Incluido pelo server 443 sempre e pelo server 80 quando FORCE_TLS=false
# (ver docker-entrypoint.sh, que gera http_mode.conf).

# WebSocket endpoint (must come before generic /api/)
location /api/ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# API proxy
location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 100m;
}

# Django admin — prefixo gerado no boot a partir de ADMIN_URL
# (ver docker-entrypoint.sh). E a unica area servida pelo backend hoje.
include /etc/nginx/includes/admin_location.conf;

# SPA fallback.
#
# O index.html NAO pode ser cacheado. Ele e o unico arquivo com nome fixo, e e
# quem aponta para o bundle — que leva hash no nome e muda a cada build. Servido
# de um cache antigo, ele pede um `main.<hash>.js` que ja nao existe: no melhor
# caso a pagina volta com a versao anterior, no pior ela nao carrega. Sem
# `Cache-Control` explicito o navegador decide por heuristica, que e justamente
# o comportamento imprevisivel que se quer evitar aqui.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
}

# Assets com hash de conteudo no nome podem ser cacheados para sempre: um
# conteudo novo vem com nome novo. E o oposto do index.html logo acima.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
