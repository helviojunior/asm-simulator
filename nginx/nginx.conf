worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide server info
    server_tokens off;
    more_clear_headers Server;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Esquema efetivo da requisicao. O nginx serve SOMENTE HTTP, mas um proxy
    # upstream (CDN, load balancer) pode terminar TLS e mandar
    # X-Forwarded-Proto: https — nesse caso repassamos https para o backend,
    # para que os links absolutos do Django saiam corretos.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^https$" https;
        "~*^http$"  http;
    }

    # Real client IP: as faixas confiaveis (set_real_ip_from) vem do .env e sao
    # geradas no boot em /etc/nginx/includes/real_ip.conf.
    include /etc/nginx/includes/real_ip.conf;

    # Upstream backend
    upstream backend {
        server backend:8001;
    }

    # Servidor unico, HTTP puro. Nao ha listen 443, certificado nem HSTS: TLS,
    # se necessario, e responsabilidade de um proxy na frente deste container.
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/includes/app_locations.conf;
    }
}
